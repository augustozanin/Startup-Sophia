<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Sophia — Transcrição (gravação completa)</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 720px;
    margin: 60px auto;
    padding: 0 20px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; }
  #status {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 13px;
    background: #eee;
    margin-bottom: 16px;
  }
  #status.recording { background: #ffe1e1; color: #b00020; }
  #status.processing { background: #fff4d6; color: #9a6a00; }
  .mic-level {
    width: 100%;
    height: 10px;
    background: #eee;
    border-radius: 999px;
    overflow: hidden;
    margin: 4px 0 6px 0;
  }
  .mic-level-fill {
    height: 100%;
    width: 0%;
    background: #2ecc71;
    transition: width 80ms linear;
  }
  .mic-status {
    font-size: 13px;
    color: #999;
    margin-bottom: 16px;
  }
  .mic-status.active { color: #1f9d55; font-weight: 600; }
  button {
    padding: 10px 20px;
    font-size: 15px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    margin-right: 10px;
  }
  #startBtn { background: #1a1a1a; color: white; }
  #stopBtn { background: #eee; color: #1a1a1a; }
  button:disabled { opacity: 0.4; cursor: default; }
  #transcript {
    margin-top: 24px;
    padding: 20px;
    background: white;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    min-height: 150px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  select {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
    min-width: 260px;
  }
</style>
</head>
<body>

<h1>Sophia — Transcrição</h1>
<p class="sub">Grava a conversa inteira e transcreve tudo de uma vez no final (sem tempo real por enquanto).</p>

<div style="margin-bottom: 16px;">
  <label for="micSelect" style="font-size: 13px; color: #666; display: block; margin-bottom: 4px;">
    Microfone:
  </label>
  <select id="micSelect"></select>
</div>

<span id="status">parado</span><br><br>

<div class="mic-level"><div id="micLevelFill" class="mic-level-fill"></div></div>
<div id="micStatus" class="mic-status">🎤 microfone parado</div>

<button id="startBtn">Iniciar gravação</button>
<button id="stopBtn" disabled>Parar e transcrever</button>

<div id="transcript">A transcrição vai aparecer aqui depois que você parar a gravação.</div>

<div id="revisaoArea" style="margin-top: 16px;">
  <label for="groqKeyInput" style="font-size: 13px; color: #666; display: block; margin-bottom: 4px;">
    Chave da API Groq (fica só nesta aba, não é salva — deixe vazio para usar a do .env do backend):
  </label>
  <input
    type="password"
    id="groqKeyInput"
    placeholder="gsk_..."
    style="padding: 8px; border-radius: 6px; border: 1px solid #ccc; width: 100%; max-width: 400px; margin-bottom: 10px;"
  />
  <div id="revisaoStatus" style="font-size: 13px; color: #999; margin-top: 8px;"></div>
</div>

<script>
const API_URL = "http://localhost:8000/transcribe";
const REVISAR_URL = "http://localhost:8000/revisar-transcricao";
const SALVAR_URL = "http://localhost:8000/salvar-transcricao";

const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const statusEl = document.getElementById("status");
const transcriptEl = document.getElementById("transcript");
const micLevelFill = document.getElementById("micLevelFill");
const micStatusEl = document.getElementById("micStatus");
const micSelect = document.getElementById("micSelect");
const revisaoArea = document.getElementById("revisaoArea");
const groqKeyInput = document.getElementById("groqKeyInput");
const revisaoStatus = document.getElementById("revisaoStatus");

let mediaStream;
let mediaRecorder;
let recordedChunks = [];

// --- Medidor de nível do microfone (Web Audio API) ---
let audioContext, analyser, micDataArray, meterFrameId;

function setupMicMeter(stream) {
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioContext.createMediaStreamSource(stream);
  analyser = audioContext.createAnalyser();
  analyser.fftSize = 2048;
  source.connect(analyser);
  micDataArray = new Uint8Array(analyser.fftSize);
  updateMicMeter();
}

function updateMicMeter() {
  analyser.getByteTimeDomainData(micDataArray);
  let peak = 0;
  for (let i = 0; i < micDataArray.length; i++) {
    const value = Math.abs(micDataArray[i] - 128) / 128;
    if (value > peak) peak = value;
  }
  const level = Math.min(100, Math.round(peak * 100));

  micLevelFill.style.width = level + "%";

  if (level > 8) {
    micStatusEl.textContent = "🎤 captando áudio...";
    micStatusEl.classList.add("active");
  } else {
    micStatusEl.textContent = "🎤 microfone ligado (silêncio)";
    micStatusEl.classList.remove("active");
  }

  meterFrameId = requestAnimationFrame(updateMicMeter);
}

function stopMicMeter() {
  if (meterFrameId) cancelAnimationFrame(meterFrameId);
  if (audioContext) audioContext.close();
  micLevelFill.style.width = "0%";
  micStatusEl.textContent = "🎤 microfone parado";
  micStatusEl.classList.remove("active");
}

// --- Seletor de microfone ---

async function popularListaMicrofones() {
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const mics = devices.filter((d) => d.kind === "audioinput");
    const selecionadoAntes = micSelect.value;

    micSelect.innerHTML = "";

    if (mics.length === 0) {
      const option = document.createElement("option");
      option.textContent = "Nenhum microfone encontrado";
      micSelect.appendChild(option);
      return;
    }

    mics.forEach((mic, i) => {
      const option = document.createElement("option");
      option.value = mic.deviceId;
      option.textContent = mic.label || `Microfone ${i + 1}`;
      micSelect.appendChild(option);
    });

    if (mics.some((m) => m.deviceId === selecionadoAntes)) {
      micSelect.value = selecionadoAntes;
    }
  } catch (err) {
    console.error("Erro ao listar microfones:", err);
  }
}

async function pedirPermissaoEListarMics() {
  try {
    const tempStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    tempStream.getTracks().forEach((t) => t.stop());
  } catch (err) {
    console.warn("Permissão de microfone ainda não concedida:", err);
  }
  await popularListaMicrofones();
}

if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
  navigator.mediaDevices.addEventListener("devicechange", popularListaMicrofones);
  pedirPermissaoEListarMics();
} else {
  micSelect.innerHTML = '<option>Acesse via http://localhost (não IP) para listar microfones</option>';
  console.warn(
    "navigator.mediaDevices indisponível — abra via https:// ou http://localhost."
  );
}

// --- Gravação (arquivo único, do início ao fim) ---

startBtn.onclick = async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert(
      "O navegador não permite acesso ao microfone neste endereço.\n\n" +
      "Abra a página via http://localhost:5500 (não pelo IP da rede)."
    );
    return;
  }

  try {
    const dispositivoSelecionado = micSelect.value;

    mediaStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        deviceId: dispositivoSelecionado ? { exact: dispositivoSelecionado } : undefined,
        autoGainControl: false,
        echoCancellation: false,
        noiseSuppression: false,
      },
    });

    setupMicMeter(mediaStream);

    recordedChunks = [];
    mediaRecorder = new MediaRecorder(mediaStream, { mimeType: "audio/webm;codecs=opus" });

    mediaRecorder.ondataavailable = (event) => {
      if (event.data.size > 0) recordedChunks.push(event.data);
    };

    mediaRecorder.start();

    statusEl.textContent = "gravando... (fale à vontade, sem pressa)";
    statusEl.className = "recording";
    transcriptEl.textContent = "";
    startBtn.disabled = true;
    stopBtn.disabled = false;

  } catch (err) {
    alert("Não foi possível acessar o microfone: " + err.message);
  }
};

stopBtn.onclick = () => {
  stopMicMeter();
  stopBtn.disabled = true;

  mediaRecorder.onstop = async () => {
    mediaStream.getTracks().forEach((t) => t.stop());

    statusEl.textContent = "transcrevendo... (pode levar um tempo, aguarde)";
    statusEl.className = "processing";
    transcriptEl.textContent = "";

    const blob = new Blob(recordedChunks, { type: "audio/webm;codecs=opus" });
    const formData = new FormData();
    formData.append("audio", blob, "gravacao.webm");

    try {
      const resposta = await fetch(API_URL, { method: "POST", body: formData });

      if (!resposta.ok) {
        throw new Error(`Servidor respondeu com status ${resposta.status}`);
      }

      const dados = await resposta.json();
      const textoTranscrito = dados.text || "";
      transcriptEl.textContent = textoTranscrito || "(nenhuma fala reconhecida no áudio)";

      let textoFinal = textoTranscrito;

      if (textoTranscrito) {
        textoFinal = await revisarAutomaticamente(textoTranscrito);
        await salvarTranscricao(textoFinal);
      }

    } catch (err) {
      transcriptEl.innerHTML = `<div style="color:red">Erro ao transcrever: ${err.message}</div>`;
      console.error(err);
    } finally {
      statusEl.textContent = "parado";
      statusEl.className = "";
      startBtn.disabled = false;
    }
  };

  mediaRecorder.stop();
};

// Chama a revisão da IA automaticamente e devolve o texto final
// (revisado, ou o original se a revisão falhar por algum motivo).
async function revisarAutomaticamente(texto) {
  const chave = groqKeyInput.value.trim(); // pode ficar vazio (usa .env do backend)

  revisaoStatus.textContent = "Revisando automaticamente com IA...";

  try {
    const resposta = await fetch(REVISAR_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto, groq_api_key: chave }),
    });

    const dados = await resposta.json();

    if (dados.erro) {
      throw new Error(dados.erro);
    }

    transcriptEl.textContent = dados.texto_revisado;
    revisaoStatus.textContent = "✅ Revisado automaticamente.";
    return dados.texto_revisado;

  } catch (err) {
    revisaoStatus.innerHTML = `<span style="color:red">Revisão falhou (mantendo texto original): ${err.message}</span>`;
    console.error(err);
    return texto; // segue com o texto bruto se a revisão falhar
  }
}

// Salva o texto final (já revisado) em um arquivo .txt no backend.
async function salvarTranscricao(texto) {
  try {
    const resposta = await fetch(SALVAR_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto }),
    });

    const dados = await resposta.json();

    if (dados.erro) {
      throw new Error(dados.erro);
    }

    let msg = "";
    if (dados.mongo_id) msg += ` 💾 Salvo no MongoDB (id: ${dados.mongo_id})`;
    if (dados.erro_mongo) msg += ` ⚠️ Falhou ao salvar no MongoDB: ${dados.erro_mongo}`;
    if (dados.aviso) msg += ` ⚠️ ${dados.aviso}`;
    revisaoStatus.textContent += msg;

  } catch (err) {
    console.error("Erro ao salvar transcrição:", err);
    revisaoStatus.innerHTML += `<br><span style="color:red">Erro ao salvar arquivo: ${err.message}</span>`;
  }
}
</script>

</body>
</html>
